# szl-evidence-litellm — tamper-evident DSSE receipts for every LiteLLM request.
#
# This package is independently installable:
#     pip install -e packages/szl-receipts          # the trust core (sibling)
#     pip install -e packages/szl-evidence-litellm  # this plugin
#
# Runtime dependencies are deliberately thin: the receipt core (which itself
# depends only on `cryptography`) and `cryptography`. LiteLLM, FastAPI and
# Uvicorn are OPTIONAL extras — the plugin degrades to a structural duck-type
# when litellm is absent, and the demo proxy is only needed for the demo.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "szl-evidence-litellm"
version = "0.1.2"
description = "SZL Evidence Plane plugin for LiteLLM: hash-chained, DSSE-signed receipts for every LLM request via LiteLLM's callback system."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
license = { text = "Apache-2.0" }
authors = [{ name = "SZL Holdings" }]
keywords = ["litellm", "receipts", "dsse", "audit", "evidence", "otel", "genai"]
# szl-receipts is published to PyPI from this repository (packages/szl-receipts);
# for local development install the sibling editable first.
dependencies = ["szl-receipts>=14.0", "cryptography>=42"]

[project.optional-dependencies]
litellm = ["litellm>=1.40"]
proxy = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest"]

[project.scripts]
szl-evidence-litellm = "szl_evidence_litellm.cli:main"

[project.urls]
Homepage = "https://github.com/szl-holdings/szl-evidence-litellm"
Source = "https://github.com/szl-holdings/szl-evidence-litellm"
Issues = "https://github.com/szl-holdings/szl-evidence-litellm/issues"
Changelog = "https://github.com/szl-holdings/szl-evidence-litellm/releases"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# Package-local pytest config: when pytest is pointed at this package directly,
# this ini wins over the workspace root. We keep the root's doctrine (depreca-
# tions are errors) but carve out litellm's own third-party DeprecationWarnings,
# which are not ours to fix and would otherwise fail the integration module.

[tool.pytest.ini_options]
addopts = "-q"
filterwarnings = [
    "error::DeprecationWarning",
    "ignore::DeprecationWarning:litellm.*",
    "ignore::DeprecationWarning:pydantic.*",
    "ignore::DeprecationWarning:httpx.*",
    "ignore::DeprecationWarning:openai.*",
    "ignore::DeprecationWarning:jsonschema.*",
    "ignore::DeprecationWarning:aiohttp.*",
]

[tool.szl.release]
import_names = ["szl_evidence_litellm"] # wheel top-level import names; the release gate fails if the built wheel differs
