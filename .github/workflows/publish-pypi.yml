name: publish to PyPI

# Trusted Publishing (OIDC) — no long-lived PyPI token stored anywhere.
# PyPI allows only ONE pending publisher per (owner, repo, workflow,
# environment) combo, so each package publishes under its OWN environment:
#   - szl-receipts          -> environment "pypi"
#   - szl-evidence-litellm  -> environment "pypi-litellm"
# One-time setup (owner, on pypi.org -> Publishing -> Add a pending publisher):
#   szl-receipts:         owner szl-holdings, repo szl-evidence-litellm,
#                         workflow publish-pypi.yml, environment pypi
#   szl-evidence-litellm: owner szl-holdings, repo szl-evidence-litellm,
#                         workflow publish-pypi.yml, environment pypi-litellm
# First run creates each project; later runs publish new versions.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  build-dists:
    name: Build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build each package into its own dist dir
        run: |
          python -m pip install --disable-pip-version-check build
          python -m build --outdir dist-receipts/ packages/szl-receipts
          python -m build --outdir dist-litellm/ packages/szl-evidence-litellm
          (cd dist-receipts && sha256sum * | tee SHA256SUMS.txt)
          (cd dist-litellm && sha256sum * | tee SHA256SUMS.txt)
      - name: Upload szl-receipts dists
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pypi-dists-receipts
          path: dist-receipts/
          if-no-files-found: error
      - name: Upload szl-evidence-litellm dists
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pypi-dists-litellm
          path: dist-litellm/
          if-no-files-found: error

  publish-receipts:
    name: Publish szl-receipts (trusted publisher)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-dists
    environment:
      name: pypi
      url: https://pypi.org/project/szl-receipts
    permissions:
      id-token: write   # OIDC for trusted publishing
      contents: read
    steps:
      - name: Download szl-receipts dists
        uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e # v4.1.7
        with:
          name: pypi-dists-receipts
          path: dist/
      - name: Publish szl-receipts to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          skip-existing: true
          print-hash: true

  publish-litellm:
    name: Publish szl-evidence-litellm (trusted publisher)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-dists, publish-receipts]  # receipts first: litellm depends on it
    environment:
      name: pypi-litellm
      url: https://pypi.org/project/szl-evidence-litellm
    permissions:
      id-token: write   # OIDC for trusted publishing
      contents: read
    steps:
      - name: Download szl-evidence-litellm dists
        uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e # v4.1.7
        with:
          name: pypi-dists-litellm
          path: dist/
      - name: Publish szl-evidence-litellm to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          skip-existing: true
          print-hash: true
