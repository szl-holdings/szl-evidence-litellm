name: publish to PyPI

# Trusted Publishing (OIDC) — no long-lived PyPI token stored anywhere.
# One-time setup (owner, on pypi.org): for each of szl-receipts and
# szl-evidence-litellm, add a "pending publisher" pointing at this repo,
# workflow publish-pypi.yml, environment "pypi". First release creates the
# project; later releases publish new versions automatically.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  build-dists:
    name: Build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build szl-receipts then szl-evidence-litellm
        run: |
          python -m pip install --disable-pip-version-check build
          python -m build --outdir dist/ packages/szl-receipts
          python -m build --outdir dist/ packages/szl-evidence-litellm
          cd dist && sha256sum * | tee SHA256SUMS.txt
      - name: Upload dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pypi-dists
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI (trusted publisher)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-dists
    environment:
      name: pypi
      url: https://pypi.org/project/szl-evidence-litellm
    permissions:
      id-token: write   # OIDC for trusted publishing
      contents: read
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.7
        with:
          name: pypi-dists
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          skip-existing: true
          print-hash: true
